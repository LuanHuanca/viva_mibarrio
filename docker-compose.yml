# Puerto host 5433 → evita choque con Postgres local en 5432
services:
  postgres:
    image: postgres:16-alpine
    container_name: viva_barrio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: viva_dev_password
      POSTGRES_DB: viva_barrio
    ports:
      - "5433:5432"
    volumes:
      - viva_barrio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viva_barrio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  viva_barrio_pgdata:
